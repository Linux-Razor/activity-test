name: Safe Activity Test

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create activity log entry
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          mkdir -p activity
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Workflow run $TS" >> activity/activity.log
          git add activity/activity.log
          git commit -m "chore: activity test commit $TS"
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          git push
          echo "✓ Real commit created with current timestamp"

      - name: Create test issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_URL=$(gh issue create \
            --title "Activity test: ${{ github.run_id }}" \
            --body "## Workflow Test

          Created by: Safe Activity workflow
          Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Run ID: ${{ github.run_id }}
          Commit: ${{ env.COMMIT_SHA }}

          This is a test issue created with current timestamp (no backdating)." \
            --assignee @me 2>&1 || true)

          if [[ $ISSUE_URL == *"#"* ]]; then
            echo "✓ Issue created: $ISSUE_URL"
            echo "ISSUE_NUMBER=$(echo $ISSUE_URL | grep -oP '#\K[0-9]+')" >> $GITHUB_ENV
          else
            echo "⚠ Issue creation skipped or failed (may need permissions)"
          fi

      - name: Create test PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          BRANCH="activity-test-$TS"

          git checkout -b "$BRANCH"

          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] PR activity test" >> activity/activity.log
          git add activity/activity.log
          git commit -m "chore: PR activity test $TS

          - Real commit on branch
          - Current timestamp
          - Test PR creation"

          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "Activity test PR: $TS" \
            --body "## Workflow Test PR

          Created by: Safe Activity workflow
          Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Branch: $BRANCH

          ### Purpose
          - Test GitHub Actions workflow mechanics
          - Verify PR creation with current timestamp
          - No backdating or fabricated history

          ### Changes
          - Added activity log entry
          - Real commit with current timestamp" \
            --base main \
            --head "$BRANCH" 2>&1 || true)

          if [[ $PR_URL == *"#"* ]]; then
            echo "✓ Pull Request created: $PR_URL"
            echo "PR_BRANCH=$BRANCH" >> $GITHUB_ENV
          else
            echo "⚠ PR creation skipped or failed (may need permissions)"
          fi

      - name: Add workflow annotation
        if: success()
        run: |
          echo "::notice::✓ Safe Activity Test Complete
          - Created: 1 commit, 1 issue, 1 PR
          - Timestamps: Current (not backdated)
          - History: Real and transparent" | cat

      - name: Summary
        if: always()
        run: |
          echo "════════════════════════════════════"
          echo "✓ Safe Activity Test Results"
          echo "════════════════════════════════════"
          echo "Commit:     ${{ env.COMMIT_SHA }}"
          echo "Issue:      #${{ env.ISSUE_NUMBER }}"
          echo "PR Branch:  ${{ env.PR_BRANCH }}"
          echo "Timestamp:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "════════════════════════════════════"
          echo "All activity created with:"
          echo "  ✓ Current timestamp (no fabrication)"
          echo "  ✓ Real commits/issues/PRs"
          echo "  ✓ Transparent history"
          echo "  ✓ No abuse risk"
          echo "════════════════════════════════════"
