name: Full Activity Test

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        default: 'all'
        type: choice
        options: [all, commit, issue, pr, review, merge, backfill]
      backfill_year:
        description: 'Backfill: single year (e.g. 2021) or "auto" to split by year'
        required: false
        default: 'auto'
        type: string
      dry_run:
        description: 'Backfill dry run (no push)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  activity:
    runs-on: ubuntu-latest
    if: ${{ inputs.action != 'backfill' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git (as YOU, not the bot)
        env:
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
        run: |
          git config user.name  "$GIT_USER"
          git config user.email "$GIT_EMAIL"

      - name: Detect default branch
        id: defbranch
        run: |
          DEFAULT=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@' || echo main)
          echo "name=$DEFAULT" >> $GITHUB_OUTPUT

      # ---------- COMMIT (on default branch) ----------
      - name: Create commit on default branch
        if: ${{ inputs.action == 'all' || inputs.action == 'commit' }}
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          mkdir -p activity
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] commit $TS" >> activity/activity.log
          git add activity/activity.log
          git commit -m "chore: activity commit $TS"
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          git push origin HEAD:${{ steps.defbranch.outputs.name }}

      # ---------- ISSUE (opened by you) ----------
      - name: Create issue
        if: ${{ inputs.action == 'all' || inputs.action == 'issue' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          URL=$(gh issue create \
            --title "Activity test issue ${{ github.run_id }}" \
            --body "Opened by workflow at $(date -u +%Y-%m-%dT%H:%M:%SZ)." 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            NUM=$(echo "$URL" | grep -oE '[0-9]+$')
            echo "ISSUE_NUMBER=$NUM" >> $GITHUB_ENV
            gh issue close "$NUM" --comment "Closing as part of activity test." || true
          else
            echo "Issue failed: $URL"
          fi

      # ---------- PR (opened by you) ----------
      - name: Create PR
        if: ${{ inputs.action == 'all' || inputs.action == 'pr' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          BRANCH="activity-pr-$TS"
          git checkout -b "$BRANCH"
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] pr $TS" >> activity/activity.log
          git add activity/activity.log
          git commit -m "chore: PR activity $TS"
          git push -u origin "$BRANCH"

          set +e
          URL=$(gh pr create \
            --title "Activity PR $TS" \
            --body "Opened by workflow at $(date -u +%Y-%m-%dT%H:%M:%SZ)." \
            --base "${{ steps.defbranch.outputs.name }}" \
            --head "$BRANCH" 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            NUM=$(echo "$URL" | grep -oE '[0-9]+$')
            echo "PR_NUMBER=$NUM" >> $GITHUB_ENV
            echo "PR_BRANCH=$BRANCH" >> $GITHUB_ENV
          else
            echo "PR failed: $URL"
          fi

      # ---------- SELF-REVIEW ----------
      - name: Submit review on the PR
        if: ${{ (inputs.action == 'all' || inputs.action == 'review') && env.PR_NUMBER != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh pr review "$PR_NUMBER" --comment --body "Self-review comment at $(date -u +%Y-%m-%dT%H:%M:%SZ)." 2>&1
          echo "review rc=$?"
          set -e

      # ---------- MERGE ----------
      - name: Merge PR
        if: ${{ (inputs.action == 'all' || inputs.action == 'merge') && env.PR_NUMBER != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch \
            --subject "chore: merge activity PR ${{ github.run_id }}" || true

      # ---------- CO-AUTHORED COMMIT ----------
      - name: Co-authored commit on default branch
        if: ${{ inputs.action == 'all' }}
        env:
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          git checkout "${{ steps.defbranch.outputs.name }}"
          git pull --rebase
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] co-authored $TS" >> activity/activity.log
          git add activity/activity.log
          git commit -m "chore: co-authored activity $TS

          Co-authored-by: $GIT_USER <$GIT_EMAIL>"
          git push origin HEAD:${{ steps.defbranch.outputs.name }}

  # ============================================================
  # BACKFILL JOB — generates dated commit history per density spec
  # ============================================================
  backfill:
    runs-on: ubuntu-latest
    if: ${{ inputs.action == 'backfill' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git (as YOU)
        env:
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
        run: |
          git config user.name  "$GIT_USER"
          git config user.email "$GIT_EMAIL"

      - name: Detect default branch
        id: defbranch
        run: |
          DEFAULT=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@' || echo main)
          echo "name=$DEFAULT" >> $GITHUB_OUTPUT

      - name: Build backfill script
        run: |
          cat > backfill.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          YEAR="${1:-auto}"
          DRY="${2:-false}"
          END_DATE="2026-09-10"

          git config user.name  "${GIT_USER}"
          git config user.email "${GIT_EMAIL}"

          # Random integer in [min,max]
          rand_int() { echo $(( RANDOM % ($2 - $1 + 1) + $1 )); }

          # Random date within a year, skipping future dates
          rand_date_in_year() {
            local year="$1"
            local start="${year}-01-01"
            local end="${year}-12-31"
            if [[ "${year}" == "2026" ]]; then end="${END_DATE}"; fi
            # Convert to epoch, pick random day, convert back
            local s e d
            s=$(date -u -d "$start" +%s)
            e=$(date -u -d "$end"   +%s)
            d=$(( RANDOM % (e - s) + s ))
            date -u -d "@$d" +%Y-%m-%d
          }

          # Add N commits for a given date, at deterministic-ish times
          make_commits() {
            local day="$1"; local n="$2"; local tag="$3"
            for i in $(seq 1 "$n"); do
              local hh mm ss
              hh=$(printf '%02d' $(rand_int 8 22))
              mm=$(printf '%02d' $(rand_int 0 59))
              ss=$(printf '%02d' $(rand_int 0 59))
              local stamp="${day}T${hh}:${mm}:${ss}Z"
              mkdir -p activity
              echo "[${stamp}] ${tag} #${i}" >> activity/activity.log
              git add activity/activity.log
              GIT_AUTHOR_DATE="$stamp" GIT_COMMITTER_DATE="$stamp" \
                git commit -q -m "chore(${tag}): activity ${day} #${i}"
            done
          }

          # ---------- DENSITY PLAN ----------
          # 2019: 1 commit every 14-21 days
          plan_2019() {
            local d="2019-01-01"
            while [[ "$d" < "2020-01-01" ]]; do
              make_commits "$d" 1 "sparse"
              local gap; gap=$(rand_int 14 21)
              d=$(date -u -d "$d + $gap days" +%Y-%m-%d)
            done
          }

          # 2020: 1 commit every 7-14 days
          plan_2020() {
            local d="2020-01-01"
            while [[ "$d" < "2021-01-01" ]]; do
              make_commits "$d" 1 "sparse"
              local gap; gap=$(rand_int 7 14)
              d=$(date -u -d "$d + $gap days" +%Y-%m-%d)
            done
          }

          # 2021: >=3 days/week, 1-2 commits each
          plan_2021() {
            local d="2021-01-01"
            while [[ "$d" < "2022-01-01" ]]; do
              local dow; dow=$(date -u -d "$d" +%u)   # 1=Mon..7=Sun
              # Mon/Wed/Fri/Sat/Sun -> ~5 days/wk, guaranteeing >=3
              if [[ "$dow" =~ ^(1|3|5|6|7)$ ]]; then
                make_commits "$d" "$(rand_int 1 2)" "frequent"
              fi
              d=$(date -u -d "$d + 1 day" +%Y-%m-%d)
            done
          }

          # 2022 -> END_DATE: every day, 3-10+ commits, ramping up
          plan_daily_from() {
            local year="$1"
            local d="${year}-01-01"
            local end="${year}-12-31"
            if [[ "$year" == "2026" ]]; then end="$END_DATE"; fi
            while [[ "$d" < "$end" || "$d" == "$end" ]]; do
              local count
              case "$year" in
                2022) count=$(rand_int 3 4)  ;;
                2023) count=$(rand_int 3 5)  ;;
                2024) count=$(rand_int 4 6)  ;;
                2025) count=$(rand_int 5 8)  ;;
                2026) count=$(rand_int 6 10) ;;
              esac
              make_commits "$d" "$count" "daily"
              d=$(date -u -d "$d + 1 day" +%Y-%m-%d)
            done
          }

          run_year() {
            case "$1" in
              2019) plan_2019 ;;
              2020) plan_2020 ;;
              2021) plan_2021 ;;
              2022|2023|2024|2025|2026) plan_daily_from "$1" ;;
              *) echo "Unknown year $1"; exit 1 ;;
            esac
          }

          if [[ "$YEAR" == "auto" ]]; then
            for y in 2019 2020 2021 2022 2023 2024 2025 2026; do
              echo ">>> Backfilling $y"
              run_year "$y"
            done
          else
            echo ">>> Backfilling $YEAR"
            run_year "$YEAR"
          fi

          # ---------- PUSH ----------
          if [[ "$DRY" == "true" ]]; then
            echo "DRY RUN — not pushing. Last 5 commits:"
            git log --oneline -5
            exit 0
          fi

          BRANCH="${DEFAULT_BRANCH:-main}"
          git push --force origin "HEAD:${BRANCH}"
          EOF
          chmod +x backfill.sh

      - name: Run backfill
        env:
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          DEFAULT_BRANCH: ${{ steps.defbranch.outputs.name }}
        run: |
          ./backfill.sh "${{ inputs.backfill_year }}" "${{ inputs.dry_run }}"
